<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Kamil Çağlar, Software Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3f6fa"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0969da"/>
      <stop offset="1" stop-color="#0969da" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#d0d7de"/>
    </pattern>
    <mask id="fade">
      <linearGradient id="m" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0.35" stop-color="#000"/>
        <stop offset="1" stop-color="#fff"/>
      </linearGradient>
      <rect width="1200" height="280" fill="url(#m)"/>
    </mask>
  </defs>
  <rect width="1200" height="280" rx="14" fill="url(#bg)" stroke="#8b949e" stroke-opacity=".25"/>
  <rect width="1200" height="280" rx="14" fill="url(#dots)" mask="url(#fade)"/>
  <g transform="translate(880 52)" fill="none" stroke="#0969da" stroke-width="1.5">
    <rect x="0"  y="120" width="220" height="56" rx="10" fill="#ffffff" stroke-opacity=".35"/>
    <rect x="30" y="64"  width="220" height="56" rx="10" fill="#ffffff" stroke-opacity=".6"/>
    <rect x="60" y="8"   width="220" height="56" rx="10" fill="#ffffff" stroke-opacity=".95"/>
    <circle cx="86"  cy="36" r="5" fill="#0969da" stroke="none"/>
    <circle cx="56"  cy="92" r="5" fill="#0969da" fill-opacity=".6" stroke="none"/>
    <circle cx="26"  cy="148" r="5" fill="#0969da" fill-opacity=".35" stroke="none"/>
  </g>
  <g font-family="-apple-system, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="128" font-size="60" font-weight="700" letter-spacing="-1.5" fill="#1f2328">Kamil Çağlar</text>
    <text x="66" y="172" font-size="24" fill="#59636e">Software Engineer · iOS · Warsaw, Poland</text>
  </g>
  <rect x="66" y="200" width="160" height="3" rx="1.5" fill="url(#accent)"/>
</svg>
